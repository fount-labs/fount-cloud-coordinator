# Fount Cloud's coordinator enclave, P2's first slice (fount m4-cloud-runners.md
# §7): it queues jobs and sends each over the attested link to a runner enclave
# measured from FOUNT_RUNNER_REPO's releases. Runners pin this repository with
# FOUNT_COORDINATOR_REPO.
#
# TEST DATA ONLY. Its ways in are the attested client channel (--client-listen),
# which takes dev fount-infra's credentials and grants naming this enclave's
# origin, and the dev API behind a bearer token (--test-api), both on the shim's
# one port. Its wrapping key is the dev one (--wrapping-key dev), made at boot
# on the state volume. It must say dev: vault is the default and refuses --test-api,
# and the real coordinators take theirs from the Cloud vaults.
cvm-version: 0.14.19 # https://github.com/tinfoilsh/cvmimage/releases/latest, no `v`
cpus: 4
memory: 16384

attested-keys:
  # Its end of the link to runners (internal/link); runners declare the same id.
  - id: fount-link
    key: ed25519
  # Signs each job's credential (internal/jobcred). The proxy learns it from
  # this enclave's attestation (fount-infra proxy-server/coordinator-keys.ts).
  - id: job-signing
    key: ed25519
  # Its end of the attested client channel (internal/channel): the TLS key
  # Desktop's broker checks against this repo's releases.
  - id: fount-client
    key: ed25519

networks:
  coordinator-out:
    egress: allowlist
    allow:
      # No runner enclaves: they dial in (--runners-dial-in), as a stopped
      # runner's name doesn't resolve and one name that doesn't fails the whole
      # allowlist. Checking a runner needs no hosts: a V3 document carries its
      # own collateral, verified offline.
      # The mail edge (--mail), checked against fount-labs/fount-mail-edge's
      # releases the same way.
      - edge.fount.containers.tinfoil.dev
      # Dev fount-infra, which renews Cloud mailboxes' entitlements
      # (--mail-entitlements) and answers firm teams' billing (--team-billing).
      - v5yqocwk2b.execute-api.us-east-1.amazonaws.com

# The coordinator's state, on a Tinfoil encrypted disk (coordinator-a-state,
# attached as state). No key-secret: the coordinator unlocks it itself over
# the volume's control socket (--volume), with a key only it derives: from
# the Cloud vaults' wrapping key in production, here from the dev seed
# FOUNT_MAIL_GENERATION_AUTHORITY. A blank disk is initialized on first boot.
volumes:
  - name: state

containers:
  - name: coordinator
    image: "ghcr.io/fount-labs/fount-broker/coordinator@sha256:c6320901d59130634e134244cca644bf6d3f11da23e08cbec612f652203822be" # fount-broker v0.8.6
    networks: [coordinator-out]
    keys: [fount-link, job-signing, fount-client]
    attestation: true
    restart: always
    command:
      - "--dir"
      - "/state"
      - "--runners-dial-in" # runners link in on --client-listen's /fount-link
      - "--runners"
      - "1"
      - "--slots"
      - "16" # the runner's fount-supervisor --max-jobs
      - "--account-jobs"
      - "12" # one account's Tinfoil key: about 3-6 model calls a minute a job
      - "--wrapping-key"
      - "dev"
      - "--test-api"
      - "--listen"
      - "127.0.0.1:8790" # the shim reaches the test API on the client port
      - "--client-listen"
      - "0.0.0.0:8792"
      - "--client-audience"
      - "https://coordinator-a.fount.containers.tinfoil.dev"
      # Hour-long Cloud credentials only, not 7-day device ones, so a device
      # fount-infra revokes, or an account whose Cloud lapses, is shut out
      # within the hour.
      - "--cloud-credentials-only"
      # Team runners (launch plan R2/R3): a runner named runner-dev-tm-<24 hex>
      # serves that team alone for its boot, and a team's jobs wait for its
      # runner. fount-infra's team-runner Lambda starts and stops them from
      # /control/runners.
      - "--team-runner-stage"
      - "dev"
      # The model of every job a thread operation (startThread, sendNote)
      # starts: DeepSeek V4.1 Flash, the Cloud jobs' model at 90 RPM an account.
      # Workers' mail from the mail edge. Generation certificates are signed
      # with a dev seed (a Tinfoil secret) whose public half is the edge's
      # COORDINATOR_AUTHORITY_KEY, standing in for the Cloud vault pair.
      - "--mail"
      - "--mail-generation-authority"
      - "env:FOUNT_MAIL_GENERATION_AUTHORITY"
      - "--volume"
      - "state"
      - "--mail-entitlements"
      - "https://v5yqocwk2b.execute-api.us-east-1.amazonaws.com/prod/"
      # Firm teams' subscriptions (POST coordinator/team-entitlement), and the
      # admin and seat statements Desktop takes to fount-infra's team billing.
      # A team pays for itself; until it does its email agents take no jobs.
      - "--team-billing"
      - "https://v5yqocwk2b.execute-api.us-east-1.amazonaws.com/prod/"
      - "--job-config"
      - '{"model":"deepseek-v4-1-flash","providerId":"tinfoil","modelId":"deepseek-v4-1-flash","route":"tinfoil","modelInfo":{"id":"deepseek-v4-1-flash","name":"V4.1 Flash","limit":{"context":1048576,"output":131072},"tool_call":true,"reasoning":false,"attachment":false,"temperature":true,"cost":{"input":0,"output":0},"modalities":{"input":["text"],"output":["text"]}},"supportsTools":true,"supportsImages":false,"memoryEnabled":false,"scriptsApproved":true}'
    persistent_volumes: [state:/state]
    env:
      - FOUNT_RUNNER_REPO: "fount-labs/fount-cloud-runner"
      # Dev fount-infra's credential-signing key (KMS, RSA 2048), SPKI DER as
      # base64: device and Cloud credentials it signs open the channel.
      - FOUNT_ACCOUNT_KEYS: ""
    secrets:
      # The test API's bearer token, 32 random bytes as hex.
      - FOUNT_TEST_API_TOKEN
      # The dev mail generation authority's Ed25519 seed, base64.
      - FOUNT_MAIL_GENERATION_AUTHORITY
      # The team-runner Lambda's bearer token for /control/runners, 32 random
      # bytes as hex; also Secrets Manager fount/coordinator-control-token-dev.
      - FOUNT_CONTROL_TOKEN
    healthcheck:
      test: ["CMD", "/fount-coordinator", "health", "http://127.0.0.1:8792/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 1m

shim:
  upstream-port: 8792
  upstream-container: coordinator
  paths:
    - /health
    - /status
    - /fount-client # the client channel, an HTTP upgrade
    - /fount-link # runner enclaves' links, HTTP upgrades they dial
    - /control/runners # teams' queues for the team-runner Lambda, behind FOUNT_CONTROL_TOKEN
    - /control/mail # the mail loop's phase and last error, behind FOUNT_CONTROL_TOKEN
    - /v0/* # the test API, behind its bearer token
